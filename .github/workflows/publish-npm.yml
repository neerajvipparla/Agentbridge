name: Publish to npm

# Runs whenever package.json changes on main - i.e. dev is merged into main
# with a version bump - and also on demand via workflow_dispatch. Skips the
# publish step (without failing the run) if the current version is already
# on the registry, so a push to main that doesn't bump the version is a
# harmless no-op instead of a failed "you cannot publish over an existing
# version" error.
#
# Publishes via npm Trusted Publishing (OIDC) - no NPM_TOKEN secret. A
# long-lived token that bypasses 2FA still hit an EOTP error on direct
# publish (npm is phasing that bypass out entirely by ~Jan 2027; see
# https://github.blog/changelog/2026-07-08-npm-install-time-security-and-gat-bypass2fa-deprecation/).
# Trusted Publishing needs npm >=11.5.1 / Node >=22.14.0 (Node 24 below
# ships npm 11.6.2) and a matching "Trusted Publisher" entry configured
# on the package's npmjs.com settings page - see the PR this shipped in
# for the exact values.
on:
  push:
    branches:
      - main
    paths:
      - "package.json"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for both npm provenance and trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check whether this version is already published
        id: version-check
        run: |
          NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "$NAME" version 2>/dev/null || echo "")
          echo "local version: $LOCAL_VERSION"
          echo "published version: ${PUBLISHED_VERSION:-(none)}"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version-check.outputs.skip != 'true'
        run: npm publish --provenance

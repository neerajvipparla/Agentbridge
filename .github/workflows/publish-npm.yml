name: Publish to npm

# Runs on every push to main. It automatically bumps the patch version,
# commits the change with [skip ci] to avoid recursion, pushes the commit
# and tag, then publishes to npm.
#
# Also runs on demand via workflow_dispatch.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Skip if this is an automated version bump
        id: skip-check
        run: |
          MESSAGE=$(git log -1 --pretty=%B)
          if echo "$MESSAGE" | grep -q '\[skip ci\]'; then
            echo "Automated version bump detected; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.skip-check.outputs.skip != 'true'
        run: npm ci

      - name: Run tests
        if: steps.skip-check.outputs.skip != 'true'
        run: npm test

      - name: Configure git
        if: steps.skip-check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        if: steps.skip-check.outputs.skip != 'true'
        run: npm version patch -m "Bump version to %s [skip ci]"

      - name: Push version bump and tag
        if: steps.skip-check.outputs.skip != 'true'
        run: git push --follow-tags

      - name: Check whether this version is already published
        if: steps.skip-check.outputs.skip != 'true'
        id: version-check
        run: |
          NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "$NAME" version 2>/dev/null || echo "")
          echo "local version: $LOCAL_VERSION"
          echo "published version: ${PUBLISHED_VERSION:-(none)}"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.skip-check.outputs.skip != 'true' && steps.version-check.outputs.skip != 'true'
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

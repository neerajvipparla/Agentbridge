name: Publish to npm

# Runs whenever package.json changes on main - i.e. dev is merged into main
# with a version bump - and also on demand via workflow_dispatch. Skips the
# publish step (without failing the run) if the current version is already
# on the registry, so a push to main that doesn't bump the version is a
# harmless no-op instead of a failed "you cannot publish over an existing
# version" error.
#
# Publishes with a token (NPM_TOKEN secret) rather than Trusted Publishing
# (OIDC). Trusted Publishing was tried first and got further - it signs
# provenance successfully - but the actual publish PUT reliably 404s for
# scoped packages, a currently open/unresolved upstream npm bug
# (npm/cli#8976, npm/cli#8678), not a config issue on our end. NPM_TOKEN
# must be a token created on npmjs.com with "Bypass two-factor
# authentication" explicitly checked at creation time - a plain token
# (or one without that box checked) fails publish with EOTP even though
# it authenticates fine for everything up to that point. That bypass is
# still allowed for direct publishing until npm's ~Jan 2027 cutoff
# (https://github.blog/changelog/2026-07-08-npm-install-time-security-and-gat-bypass2fa-deprecation/);
# revisit Trusted Publishing once the scoped-package bug above is fixed
# upstream.
#
# --provenance still works with token auth (it only needs id-token:
# write to sign the attestation - it doesn't require OIDC to be the
# *auth* mechanism too), so we keep it.
on:
  push:
    branches:
      - main
    paths:
      - "package.json"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for npm provenance signing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check whether this version is already published
        id: version-check
        run: |
          NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "$NAME" version 2>/dev/null || echo "")
          echo "local version: $LOCAL_VERSION"
          echo "published version: ${PUBLISHED_VERSION:-(none)}"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version-check.outputs.skip != 'true'
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
